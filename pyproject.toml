[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "towerlogic"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "opencv-python>=4.9.0,<5",
    "numpy>=2.2.1,<3",
    "pymemuc>=0.6.0,<0.7; sys_platform == 'win32'",
    "psutil>=6.1.0,<8",
    "pillow>=11.3.0,<13.0.0",
    "ttkbootstrap>=1.12.1,<1.21",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "onnxruntime>=1.17,<2",
]
yolo = [
    "ultralytics>=8,<9",
]

[tool.setuptools.packages.find]
include = ["towerlogic*"]

[tool.setuptools.package-data]
towerlogic = [
    "__version__",
    "models/*",
    "detection/reference_images/**/*.png",
    "interface/assets/*",
    "emulators/configs/*.json",
    "bot/detection/card_templates/*",
]
