name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements.txt
      - name: Install runtime and builder
        run: python -m pip install -r packaging/requirements.txt .
      - name: Test runtime
        run: python -m unittest discover -s tests -v
      - name: Verify release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$(cat towerlogic/__version__)"
          fi
      - name: Build native application
        run: python -m PyInstaller --clean --noconfirm packaging/TowerLogic.spec
      - name: Verify native GUI, icons, inference and worker launch
        run: python packaging/verify_build.py
      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/TowerLogic -DestinationPath dist/TowerLogic-${{ matrix.artifact }}.zip
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/TowerLogic.app dist/TowerLogic-${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TowerLogic-${{ matrix.artifact }}
          path: dist/TowerLogic-*.zip
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.artifact }}
          path: dist/smoke-test.json

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: TowerLogic-*
          merge-multiple: true
          path: artifacts
      - name: Checksums
        working-directory: artifacts
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "TowerLogic $GITHUB_REF_NAME" --notes-file packaging/RELEASE_NOTES.md
